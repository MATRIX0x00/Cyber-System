<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Default system logo: hexagon umbrella sigil (replaced automatically if the user uploads one) -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffcc"/>
      <stop offset="1" stop-color="#00aaff"/>
    </linearGradient>
  </defs>
  <g transform="translate(200 100)">
    <!-- outer hexagon -->
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.95"/>
    <!-- umbrella canopy -->
    <path d="M-52 8 A52 52 0 0 1 0 -44 A52 52 0 0 1 52 8 L44 8 A4 4 0 0 0 36 14 A4 4 0 0 0 28 8 L-28 8 A4 4 0 0 0 -36 14 A4 4 0 0 0 -44 8 Z"
          fill="none" stroke="url(#ring)" stroke-width="5" stroke-linejoin="round"/>
    <line x1="0" y1="8" x2="0" y2="52" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 52 A8 8 0 0 0 8 60" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
    <!-- scanlines -->
    <line x1="-90" y1="96" x2="90" y2="96" stroke="url(#ring)" stroke-width="2" opacity="0.35"/>
    <line x1="-70" y1="106" x2="70" y2="106" stroke="url(#ring)" stroke-width="2" opacity="0.2"/>
  </g>
</svg>
